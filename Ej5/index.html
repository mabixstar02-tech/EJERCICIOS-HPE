<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de empleados y nómina</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Gestión de empleados y nómina</h1>

    <h2>Registrar empleado</h2>

    <label>Identificación:</label>
    <input type="text" id="identificacion">
    <br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre">
    <br><br>

    <label>Tipo de empleado:</label>
    <select id="tipo">
        <option value="Planta">Empleado de planta</option>
        <option value="Contratista">Contratista</option>
    </select>
    <br><br>

    <label>Salario o tarifa:</label>
    <input type="number" id="salario">
    <br><br>

    <label>Días trabajados:</label>
    <input type="number" id="dias">
    <br><br>

    <button onclick="registrarEmpleado()">Registrar empleado</button>

    <p id="mensaje"></p>

    <h2>Listado de empleados y nómina</h2>

    <table>
        <thead>
            <tr>
                <th>Identificación</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Salario o tarifa</th>
                <th>Días trabajados</th>
                <th>Pago calculado</th>
            </tr>
        </thead>
        <tbody id="tablaEmpleados"></tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
